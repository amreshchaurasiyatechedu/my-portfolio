<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">TruthLens AI project cover</title>
  <desc id="desc">Illustrative evidence review artwork for a research prototype, not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#102c3c"/></linearGradient>
    <linearGradient id="a"><stop stop-color="#6e91ff"/><stop offset="1" stop-color="#61e3de"/></linearGradient>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <circle cx="1340" cy="80" r="270" fill="#58dfd7" opacity=".08"/>
  <text x="115" y="150" fill="#83d8df" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">TRUTHLENS AI · RESEARCH PROTOTYPE</text>
  <text x="115" y="229" fill="#f1f6ff" font-family="Arial,sans-serif" font-size="49" font-weight="700">Look closer. Check the evidence.</text>
  <text x="117" y="272" fill="#9cb1c7" font-family="Arial,sans-serif" font-size="18">Illustrative project cover · not a product screenshot</text>
  <rect x="115" y="332" width="572" height="326" rx="18" fill="#0b1928" stroke="#2b485d"/>
  <text x="150" y="379" fill="#7e9ab4" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">CLAIM UNDER REVIEW</text>
  <rect x="150" y="402" width="489" height="72" rx="10" fill="#14273a"/>
  <text x="173" y="445" fill="#e7effa" font-family="Arial,sans-serif" font-size="19">A statement worth checking...</text>
  <text x="150" y="523" fill="#7e9ab4" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">REVIEW PRINCIPLE</text>
  <text x="150" y="563" fill="#b9c9d9" font-family="Arial,sans-serif" font-size="16">Evidence first, interpretation second.</text>
  <rect x="150" y="588" width="165" height="34" rx="17" fill="#173648" stroke="#3a6d78"/>
  <text x="232" y="610" fill="#91ebe1" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">SOURCE CONTEXT</text>
  <rect x="730" y="332" width="594" height="326" rx="18" fill="#0b1928" stroke="#2b485d"/>
  <text x="768" y="379" fill="#7e9ab4" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">EVIDENCE REVIEW</text>
  <g>
    <rect x="768" y="402" width="517" height="66" rx="10" fill="#122538"/>
    <circle cx="797" cy="435" r="9" fill="#71e0ce"/>
    <text x="822" y="430" fill="#e4edf8" font-family="Arial,sans-serif" font-size="15">Retrieved source</text>
    <text x="822" y="451" fill="#8da5bd" font-family="Arial,sans-serif" font-size="12">Context to inspect</text>
    <rect x="768" y="483" width="517" height="66" rx="10" fill="#122538"/>
    <circle cx="797" cy="516" r="9" fill="#84a3ff"/>
    <text x="822" y="511" fill="#e4edf8" font-family="Arial,sans-serif" font-size="15">Evidence notes</text>
    <text x="822" y="532" fill="#8da5bd" font-family="Arial,sans-serif" font-size="12">Supporting details and uncertainty</text>
  </g>
  <path d="M768 578h517" stroke="#2b485d"/>
  <text x="768" y="612" fill="#8da5bd" font-family="Arial,sans-serif" font-size="12">Optional AI interpretation depends on provider setup.</text>
</svg>
