<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Scientific calculator project cover</title>
  <desc id="desc">Illustrative scientific calculator artwork, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172c49"/></linearGradient>
    <linearGradient id="screen" x2="1"><stop stop-color="#13213a"/><stop offset="1" stop-color="#192b47"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7e9eff"/><stop offset="1" stop-color="#62e0ec"/></linearGradient>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <circle cx="180" cy="710" r="300" fill="#4778fa" opacity=".12"/>
  <circle cx="1280" cy="100" r="220" fill="#58d8e7" opacity=".08"/>
  <text x="118" y="174" fill="#8ea3c3" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">PROJECT VISUAL · NOT A SCREENSHOT</text>
  <text x="118" y="250" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Calculate with clarity.</text>
  <text x="118" y="293" fill="#9eafca" font-family="Arial,sans-serif" font-size="17">A browser-based scientific calculator</text>
  <rect x="855" y="85" width="400" height="640" rx="32" fill="#0c1423" stroke="#354967" stroke-width="2"/>
  <rect x="876" y="108" width="358" height="594" rx="22" fill="#101d32"/>
  <text x="911" y="158" fill="#8298ba" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">SCIENTIFIC</text>
  <text x="1197" y="158" fill="#70dfeb" font-family="Arial,sans-serif" font-size="13" text-anchor="end">HISTORY</text>
  <rect x="898" y="187" width="314" height="116" rx="14" fill="url(#screen)"/>
  <text x="1183" y="226" fill="#98aaca" font-family="Arial,sans-serif" font-size="15" text-anchor="end">sin(45) + 18</text>
  <text x="1183" y="278" fill="#f3f7ff" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="end">18.707</text>
  <g font-family="Arial,sans-serif" font-size="14" text-anchor="middle">
    <g fill="#1d2d48">
      <rect x="898" y="322" width="70" height="48" rx="9"/><rect x="980" y="322" width="70" height="48" rx="9"/><rect x="1062" y="322" width="70" height="48" rx="9"/><rect x="1144" y="322" width="68" height="48" rx="9"/>
      <rect x="898" y="380" width="70" height="48" rx="9"/><rect x="980" y="380" width="70" height="48" rx="9"/><rect x="1062" y="380" width="70" height="48" rx="9"/><rect x="1144" y="380" width="68" height="48" rx="9"/>
      <rect x="898" y="438" width="70" height="48" rx="9"/><rect x="980" y="438" width="70" height="48" rx="9"/><rect x="1062" y="438" width="70" height="48" rx="9"/><rect x="1144" y="438" width="68" height="48" rx="9"/>
      <rect x="898" y="496" width="70" height="48" rx="9"/><rect x="980" y="496" width="70" height="48" rx="9"/><rect x="1062" y="496" width="70" height="48" rx="9"/><rect x="1144" y="496" width="68" height="48" rx="9"/>
      <rect x="898" y="554" width="70" height="48" rx="9"/><rect x="980" y="554" width="70" height="48" rx="9"/><rect x="1062" y="554" width="70" height="48" rx="9"/><rect x="1144" y="554" width="68" height="48" rx="9"/>
      <rect x="898" y="612" width="152" height="48" rx="9"/><rect x="1062" y="612" width="70" height="48" rx="9"/>
    </g>
    <g fill="#dce7f8">
      <text x="933" y="352">sin</text><text x="1015" y="352">cos</text><text x="1097" y="352">tan</text><text x="1178" y="352">÷</text>
      <text x="933" y="410">x²</text><text x="1015" y="410">√</text><text x="1097" y="410">( )</text><text x="1178" y="410">×</text>
      <text x="933" y="468">7</text><text x="1015" y="468">8</text><text x="1097" y="468">9</text><text x="1178" y="468">−</text>
      <text x="933" y="526">4</text><text x="1015" y="526">5</text><text x="1097" y="526">6</text><text x="1178" y="526">+</text>
      <text x="933" y="584">1</text><text x="1015" y="584">2</text><text x="1097" y="584">3</text><text x="1178" y="584">AC</text>
      <text x="974" y="642">0</text><text x="1097" y="642">.</text>
    </g>
    <rect x="1144" y="612" width="68" height="48" rx="9" fill="url(#accent)"/>
    <text x="1178" y="642" fill="#081426">=</text>
  </g>
</svg>
