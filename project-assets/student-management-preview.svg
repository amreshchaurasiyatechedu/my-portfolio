  </g>
  <text x="344" y="113" fill="#17344f" font-family="Arial,sans-serif" font-size="25" font-weight="700">Academic overview</text>
  <text x="344" y="140" fill="#728399" font-family="Arial,sans-serif" font-size="14">A role-based view of school activity</text>
