    <text x="413" y="435" fill="#30465e" font-weight="700">Aarav Sharma</text><text x="413" y="451" fill="#8a98aa" font-size="11">Student record</text>
    <text x="633" y="442" fill="#53677e">Computer Science</text><text x="810" y="442" fill="#53677e">96%</text>
    <rect x="961" y="426" width="62" height="23" rx="11" fill="#e9f8f1"/><text x="974" y="442" fill="#19845e" font-size="11" font-weight="700">Active</text>
    <circle cx="388" cy="498" r="14" fill="#f4edff"/><text x="381" y="503" fill="#7455b1" font-weight="700">MK</text>
