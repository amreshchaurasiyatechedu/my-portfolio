<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Student Management System dashboard illustration</title>
  <desc id="description">An academic dashboard illustration with navigation, student counts, attendance, and a records table.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#0b5394"/>
      <stop offset="1" stop-color="#1476c8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17406b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#background)"/>
  <circle cx="1050" cy="90" r="180" fill="#d9eaff" opacity=".58"/>
  <rect x="98" y="58" width="1004" height="584" rx="26" fill="#fff" filter="url(#shadow)"/>
  <path d="M124 58h180v584H150a26 26 0 0 1-26-26z" fill="url(#panel)"/>
  <circle cx="163" cy="112" r="18" fill="#d9ecff"/>
  <path d="M155 112h16m-8-8v16" stroke="#0b5394" stroke-width="4" stroke-linecap="round"/>
