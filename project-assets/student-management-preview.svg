    <text x="413" y="555" fill="#30465e" font-weight="700">Riya Gupta</text><text x="413" y="571" fill="#8a98aa" font-size="11">Student record</text>
    <text x="633" y="562" fill="#53677e">Mathematics</text><text x="810" y="562" fill="#53677e">88%</text>
    <rect x="961" y="546" width="62" height="23" rx="11" fill="#e9f8f1"/><text x="974" y="562" fill="#19845e" font-size="11" font-weight="700">Active</text>
