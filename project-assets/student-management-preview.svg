  <g fill="#d7eaff" font-family="Arial,sans-serif" font-size="14">
    <text x="181" y="278">Students</text><text x="181" y="326">Attendance</text>
    <text x="181" y="374">Courses</text><text x="181" y="422">Results</text>
  </g>
  <g fill="none" stroke="#d7eaff" stroke-width="2" opacity=".9">
