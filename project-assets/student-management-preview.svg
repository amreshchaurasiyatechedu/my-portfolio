  <text x="633" y="390" fill="#8492a5" font-family="Arial,sans-serif" font-size="12" font-weight="700">COURSE</text>
  <text x="794" y="390" fill="#8492a5" font-family="Arial,sans-serif" font-size="12" font-weight="700">ATTENDANCE</text>
  <text x="969" y="390" fill="#8492a5" font-family="Arial,sans-serif" font-size="12" font-weight="700">STATUS</text>
  <path d="M370 407h660M370 467h660M370 527h660" stroke="#e9eef4"/>
