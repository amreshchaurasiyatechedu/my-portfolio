  <text x="151" y="180" fill="#b9ddff" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">WORKSPACE</text>
  <rect x="143" y="200" width="142" height="43" rx="12" fill="#ffffff" opacity=".18"/>
  <circle cx="163" cy="221" r="7" fill="#fff"/>
