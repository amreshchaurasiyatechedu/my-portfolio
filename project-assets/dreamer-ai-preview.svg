<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Dreamer AI caption editor illustration</title>
  <desc id="description">A video caption editing workspace with a media preview, timed transcript, and export controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101127"/>
      <stop offset="1" stop-color="#202447"/>
    </linearGradient>
    <linearGradient id="video" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#713be8"/>
      <stop offset=".52" stop-color="#d848a5"/>
      <stop offset="1" stop-color="#ff9d59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8f6cff"/>
      <stop offset="1" stop-color="#54d7f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#060718" flood-opacity=".36"/>
    </filter>
  </defs>
